<section id="contact" class="container-section">
    <div class="container">
        <h2 class="text-center mb-5">{{'contact.title'|translate}}</h2>

        <div class="card contact-section">
            <form [formGroup]="contactForm" (ngSubmit)="onSubmit()">
                <div class="form-group">
                    <label for="name">{{'contact.form.name'|translate}}</label>
                    <input id="name" type="text" formControlName="name" class="form-control"
                        autocomplete="name" minlength="2" maxlength="80" required
                        placeholder="{{'contact.form.placeholder'| translate }} {{'contact.form.name'| translate }}" />
                </div>
                <div class="form-group">
                    <label for="email">{{'contact.form.email'|translate}}</label>
                    <input id="email" type="email" formControlName="email" class="form-control"
                        autocomplete="email" maxlength="120" required
                        placeholder="{{'contact.form.placeholder'| translate }} {{'contact.form.email'| translate }}" />
                </div>
                <div class="form-group">
                    <label for="message">{{'contact.form.message'|translate}}</label>
                    <textarea id="message" formControlName="message" class="form-control" rows="4"
                        minlength="10" maxlength="1000" required
                        placeholder="{{'contact.form.placeholder'| translate }} {{'contact.form.message'| translate }}"></textarea>
                </div>
                <div class="form-group hp-field" aria-hidden="true">
                    <label for="website">Website</label>
                    <input id="website" type="text" formControlName="website" tabindex="-1" autocomplete="off" />
                </div>
                <p *ngIf="statusMessage" class="form-status" [class.success]="statusType === 'success'"
                    [class.error]="statusType === 'error'" role="status">
                    {{ statusMessage }}
                </p>
                <button type="submit" class="btn btn-primary" [disabled]="isSubmitting">
                    {{ isSubmitting ? 'Enviando...' : ('contact.form.submit'|translate) }}
                </button>
            </form>
        </div>
    </div>
</section>
