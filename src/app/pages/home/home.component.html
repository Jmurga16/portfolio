<section #home id="home">
    <div class="profile-page">
        <div class="wrapper">
            <div class="page-header page-header-small" filter-color="green">
                <div class="page-header-image" data-parallax="true"
                    style="background-image: url('assets/images/background.jpg');">
                </div>
                <div class="container">
                    <div class="content-center">
                        <h1 class="title">{{title}}</h1>
                        <p id="animated-text" class="hero-tagline">{{displayedText || ('home.hero.title'|translate)}}</p>
                        <p class="hero-summary">{{'home.hero.subtitle'|translate}}</p>
                        <div class="contact-container">
                            <a class="btn btn-primary  smooth-scroll mr-2" href="#contact" data-aos="zoom-in"
                                data-aos-anchor="data-aos-anchor">
                                {{'home.contact'|translate}}
                            </a>
                            <a class="btn btn-secondary" href="assets/docs/CV_JoseMurga.pdf" download="CV_Jose_Murga"
                                data-aos="zoom-in" data-aos-anchor="data-aos-anchor">
                                {{'home.download'|translate}}
                            </a>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
